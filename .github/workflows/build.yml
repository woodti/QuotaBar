name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/package.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaBar-AppleSilicon-unsigned
          path: |
            dist/*.zip
            dist/*.sha256
